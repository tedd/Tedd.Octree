name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-test:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          3.1.x
          8.0.x

    - name: Restore dependencies
      working-directory: src
      run: dotnet restore
    - name: Build
      working-directory: src
      run: dotnet build --no-restore -c Release
    - name: Test
      working-directory: src
      run: dotnet test --no-build -c Release --verbosity normal

  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Publish on version change
      id: publish_nuget
      uses: tedd/publish-nuget-neo@v1
      with:
        NUGET_KEY: ${{secrets.NUGET_API_KEY}}
        PROJECT_FILE_PATH: src/Tedd.Octree/Tedd.Octree.csproj
        INCLUDE_SYMBOLS: true
        TAG_COMMIT: true
        PACKAGE_NAME: Tedd.Octree
