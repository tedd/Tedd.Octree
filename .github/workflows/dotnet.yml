name: .NET

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.100-preview.7.26381.103

      - name: Restore
        run: dotnet restore src/Tedd.Voxtree.sln

      - name: Build
        run: dotnet build src/Tedd.Voxtree.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Tedd.Voxtree.sln --no-build --configuration Release --verbosity normal

  publish:
    needs: build-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100-preview.7.26381.103

      - name: Validate tag
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/Tedd.Voxtree/Tedd.Voxtree.csproj -nologo -getProperty:Version).Trim()
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match package version '$version'."
          }

      - name: Pack
        run: dotnet pack src/Tedd.Voxtree/Tedd.Voxtree.csproj --configuration Release --output artifacts/packages

      - name: Publish to NuGet.org
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packages = @(Get-ChildItem -LiteralPath artifacts/packages -Filter *.nupkg)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NuGet package, found $($packages.Count)."
          }
          dotnet nuget push $packages[0].FullName --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
